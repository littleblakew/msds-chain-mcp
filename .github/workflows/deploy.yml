name: Deploy MCP Server

on:
  push:
    branches: [main]
  workflow_dispatch:

# CI-328: 排队，不抢杀。抢杀会把正在跑的部署半路杀掉，可能停在「镜像已推 ACR、
# Container App 还没切流量」的中间态。部署要的是按顺序全部跑完，不是只留最新那个。
# （msds-chain 的 deploy-dev/deploy-prod 同批改，那边有完整背景注释。）
concurrency:
  group: deploy-mcp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: acrmsdschainwc.azurecr.io
  RESOURCE_GROUP: rg-msds-chain-prod
  # Network-isolated public MCP core behind the private gateway (msds-chain-mcp-gateway,
  # separate repo). mcp.lagentbot.com → gateway → THIS app (internal ingress).
  APP_NAME: msds-chain-mcp-core
  # GitHub-hosted images ship az CLI without the containerapp extension; install it
  # without an interactive prompt (self-hosted runners had it installed once, by hand).
  AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mcp.lagentbot.com/health
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install --no-cache-dir -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      # Kept from the self-hosted era (shared $HOME → a parallel job's az logout could
      # wipe the default credential store mid-run). Harmless on hosted runners.
      - name: Isolate Azure CLI config
        run: echo "AZURE_CONFIG_DIR=${RUNNER_TEMP}/.azure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ACR Login
        run: az acr login --name acrmsdschainwc

      - name: Build & Push image
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/msds-chain-mcp:${{ github.sha }}"
          IMAGE_LATEST="${ACR_LOGIN_SERVER}/msds-chain-mcp:latest"

          docker buildx build \
            --push \
            --cache-from type=registry,ref=${ACR_LOGIN_SERVER}/msds-chain-mcp:cache \
            --cache-to type=registry,ref=${ACR_LOGIN_SERVER}/msds-chain-mcp:cache,mode=max \
            -t "${IMAGE}" \
            -t "${IMAGE_LATEST}" \
            .

          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Deploy to Container App
        run: |
          # Pin to a single replica: the SSE transport is stateful (the GET /sse
          # stream and POST /messages/ must hit the same replica). Without session
          # affinity, multiple replicas cause intermittent 404s on /messages/.
          # Keep min=max=1 until/unless we move to stateless Streamable HTTP.
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.IMAGE }} \
            --min-replicas 1 \
            --max-replicas 1

      - name: Ensure sticky sessions (SSE affinity)
        run: |
          az containerapp ingress sticky-sessions set \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --affinity sticky

      - name: Verify new core revision is running
        run: |
          # The core has INTERNAL ingress (not reachable from this runner). Verify the
          # newest revision reaches a Running state via the control plane instead.
          for i in $(seq 1 18); do
            STATE=$(az containerapp revision list \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "sort_by(@, &properties.createdTime)[-1].properties.runningState" -o tsv 2>/dev/null)
            echo "latest core revision runningState=$STATE"
            # ACA reports "Running" or "RunningAtMaxScale" once healthy.
            case "$STATE" in
              Running*)
                echo "✅ Core revision running"
                break
                ;;
            esac
            if [ "$i" = "18" ]; then
              echo "::error::Core revision did not reach Running state"
              exit 1
            fi
            sleep 10
          done

      - name: Gateway integration health check
        run: |
          # End-to-end public face: gateway must answer (it proxies to this core).
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://mcp.lagentbot.com/health)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Gateway health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Gateway health check passed"

      - name: MCP tool-level smoke (through gateway)
        # Beyond /health (liveness): connect as a real MCP client with a CI-scoped
        # prod key and call a couple of fast, deterministic, NON-mutating tools,
        # asserting non-empty output — so a deploy that leaves the tools broken
        # (auth, resolver, canonical data) fails loudly instead of going green.
        # Skips (does NOT fail) when the secret is unset, so deploys keep working
        # until a CI key is provisioned; once set, it is a hard gate.
        env:
          MCP_SMOKE_KEY: ${{ secrets.MCP_SMOKE_KEY }}
        run: |
          if [ -z "$MCP_SMOKE_KEY" ]; then
            echo "::warning::MCP_SMOKE_KEY not set — skipping tool-level smoke (only /health gated). Provision a CI-scoped prod key + add the secret to enable."
            exit 0
          fi
          # CI-371: 这一步在 revision 切换后 ~20s 就发起 MCP 握手，会在连接阶段炸
          # （ExceptionGroup，一行输出都没有），2026-08-07 连续两次部署各红一次，
          # 而两次的 Prod 都是好的、重跑即过。前面那步「Verify new core revision is
          # running」只查 revision 的 provisioning 状态，**不代表网关已经能完成一次
          # MCP 握手**——两者之间有真实的空窗。
          # 🔴 重试只吸收「连接建立」这一类时序噪声：脚本内部的断言失败同样会让最后
          # 一次尝试非零退出，硬门没有被削弱。别把重试次数加到能盖住真故障。
          for attempt in 1 2 3; do
            if python scripts/smoke_mcp.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::MCP smoke attempt $attempt failed — retrying in 20s (CI-371)"
              sleep 20
            fi
          done
          echo "::error::MCP smoke failed 3× over ~40s — this is not the revision-switch window"
          exit 1
