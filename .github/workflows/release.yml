name: Publish Release (npm + MCP registry)

# Tag-triggered publish. Push a v<semver> tag whose commit bumped VERSION and
# this fans out the two IRREVERSIBLE external releases automatically:
#   • npm            registry.npmjs.org/msds-chain-mcp
#   • MCP registry   registry.modelcontextprotocol.io  (what ChatGPT/claude.ai read)
#
# The core container (live serverInfo) is deployed separately by deploy.yml on
# push to main. Typical release:
#   1. edit VERSION; scripts/release.sh          # sync manifests + verify
#   2. commit + push main                        # deploy.yml ships the core
#   3. git tag vX.Y.Z && git push origin vX.Y.Z  # THIS workflow publishes
#
# scripts/release.sh --publish stays as a local fallback (uses the committed
# macOS mcp-publisher binary); CI downloads the linux binary below.
#
# Auth: BOTH publishes are tokenless, via GitHub Actions OIDC (id-token: write).
#       • npm — the package is an npm "Trusted Publisher" (npmjs.com → package →
#         Settings, bound to littleblakew/msds-chain-mcp + this workflow filename).
#         NPM_TOKEN is NO LONGER used: token publishing fails EOTP (2FA-on-writes)
#         and npm is deprecating 2FA-bypassing tokens.
#       • MCP registry — github-oidc login proves ownership of io.github.littleblakew/*.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<semver> tag to (re)publish"
        required: true

permissions:
  id-token: write   # npm trusted publishing + MCP registry github-oidc login
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.0   # modelcontextprotocol/registry release providing the linux binary

jobs:
  publish:
    # self-hosted azure-sea (2026-07-16): was ubuntu-latest, but the account's
    # GitHub-hosted minutes are exhausted → ubuntu-latest jobs no longer start. mcp
    # core has runners on azure-sea (not xtest), and this job only needs node +
    # GitHub Actions OIDC (npm trusted publishing + MCP registry github-oidc, NOT
    # Azure) — all available on self-hosted. No AZURE_CONFIG_DIR needed (no az here).
    runs-on: [self-hosted, azure-sea]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify tag matches VERSION
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${REF#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::tag v$TAG does not match VERSION file ($FILE) — tag the commit that bumped VERSION"
            exit 1
          fi
          echo "VERSION=$FILE" >> "$GITHUB_ENV"
          echo "Publishing v$FILE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version guard tests
        run: |
          pip install --no-cache-dir -r requirements-dev.txt
          python -m pytest tests/test_version.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm's OIDC trusted publishing landed in npm 11.5.1; the bundled CLI is
      # older, so upgrade explicitly — otherwise the publish silently falls back to
      # token auth (which fails, see below).
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      # NO NODE_AUTH_TOKEN on purpose: the package is registered as an npm "Trusted
      # Publisher" (npmjs.com → package → Settings: littleblakew/msds-chain-mcp +
      # release.yml), so this authenticates via the job's GitHub OIDC token
      # (permissions.id-token: write, already set above for the MCP registry).
      # If a token IS present npm prefers it over OIDC — and token publishing fails
      # here with EOTP because the account requires 2FA on writes (hit on both 1.5.0
      # and 1.5.1, each of which had to be published by hand from a browser-
      # authenticated laptop). npm is also deprecating 2FA-bypassing tokens, so OIDC
      # is the durable path; it adds provenance attestation for free.
      - name: npm publish (idempotent, OIDC trusted publishing)
        working-directory: npm-package
        run: |
          if npm view "msds-chain-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "npm already has msds-chain-mcp@${VERSION} — skipping publish"
          else
            npm publish --access public
            echo "✅ npm published ${VERSION}"
          fi

      - name: MCP registry publish (GitHub OIDC)
        working-directory: npm-package
        run: |
          set -euo pipefail
          URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "Fetching mcp-publisher ${MCP_PUBLISHER_VERSION} (linux/amd64)…"
          curl -sSL "$URL" | tar -xz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "✅ MCP registry published ${VERSION}"

      - name: Summary
        run: |
          echo "### Published v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- npm: https://www.npmjs.com/package/msds-chain-mcp/v/${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- MCP registry: io.github.littleblakew/msds-chain @ ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ChatGPT apps directory re-ingests on OpenAI's own cadence (not instant)." >> "$GITHUB_STEP_SUMMARY"
